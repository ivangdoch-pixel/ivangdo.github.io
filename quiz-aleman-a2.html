<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Quiz de Alemán A2</title>
<style>
  :root {
    --bg: #0f1420;
    --card: #171e2e;
    --card-border: #262f45;
    --accent: #4f8cff;
    --accent-dark: #3667c9;
    --good: #35c48a;
    --bad: #ff5f6d;
    --text: #eef1f8;
    --text-dim: #9aa4bd;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
    background: radial-gradient(circle at top, #1b2338 0%, #0f1420 60%);
    color: var(--text);
    min-height: 100vh;
    padding: 24px 16px 60px;
  }
  .wrap { max-width: 720px; margin: 0 auto; }
  header {
    text-align: center;
    margin-bottom: 20px;
  }
  header h1 {
    font-size: 1.5rem;
    margin: 0 0 4px;
    background: linear-gradient(90deg, #4f8cff, #7fd0ff);
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
  }
  header p { color: var(--text-dim); margin: 0; font-size: 0.9rem; }

  .toolbar {
    display: flex;
    gap: 10px;
    justify-content: center;
    flex-wrap: wrap;
    margin: 18px 0 24px;
  }
  button {
    cursor: pointer;
    border: none;
    border-radius: 10px;
    padding: 11px 18px;
    font-size: 0.95rem;
    font-weight: 600;
    transition: transform .12s ease, filter .12s ease;
  }
  button:active { transform: scale(0.97); }
  #shuffleBtn {
    background: linear-gradient(135deg, var(--accent), var(--accent-dark));
    color: white;
  }
  #shuffleBtn:hover { filter: brightness(1.1); }
  #checkBtn {
    background: var(--good);
    color: #06251a;
  }
  #resetBtn {
    background: #2a3350;
    color: var(--text);
  }

  .progress {
    text-align: center;
    color: var(--text-dim);
    font-size: 0.85rem;
    margin-bottom: 16px;
  }
  .progress-bar {
    height: 6px;
    background: #232c44;
    border-radius: 4px;
    overflow: hidden;
    margin-top: 6px;
  }
  .progress-fill {
    height: 100%;
    width: 0%;
    background: linear-gradient(90deg, var(--accent), #7fd0ff);
    transition: width .25s ease;
  }

  .card {
    background: var(--card);
    border: 1px solid var(--card-border);
    border-radius: 14px;
    padding: 18px 18px 14px;
    margin-bottom: 14px;
  }
  .qnum {
    display: inline-block;
    font-size: 0.72rem;
    color: var(--text-dim);
    background: #1f2740;
    border-radius: 6px;
    padding: 2px 8px;
    margin-bottom: 8px;
  }
  .qtext {
    font-size: 1.02rem;
    margin: 0 0 12px;
    line-height: 1.4;
  }
  .options { display: grid; gap: 8px; }
  .option {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 10px 12px;
    border-radius: 10px;
    border: 1px solid var(--card-border);
    background: #131a29;
    cursor: pointer;
    font-size: 0.95rem;
    transition: background .12s ease, border-color .12s ease;
  }
  .option:hover { border-color: var(--accent); }
  .option.selected {
    border-color: var(--accent);
    background: #1a2440;
  }
  .option input { accent-color: var(--accent); }
  .option.correct {
    border-color: var(--good);
    background: rgba(53,196,138,0.12);
  }
  .option.incorrect {
    border-color: var(--bad);
    background: rgba(255,95,109,0.12);
  }
  .option.disabled { cursor: default; }

  #results {
    text-align: center;
    padding: 26px 18px;
    border-radius: 16px;
    background: linear-gradient(145deg, #17203a, #121a2c);
    border: 1px solid var(--card-border);
    margin-bottom: 20px;
    display: none;
  }
  #results h2 { margin: 0 0 6px; font-size: 1.6rem; }
  #results .score-big {
    font-size: 2.6rem;
    font-weight: 800;
    background: linear-gradient(90deg, var(--accent), var(--good));
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
  }
  #results p { color: var(--text-dim); margin: 6px 0 18px; }

  footer {
    text-align: center;
    color: var(--text-dim);
    font-size: 0.78rem;
    margin-top: 30px;
  }

  @media (max-width: 480px) {
    header h1 { font-size: 1.25rem; }
    .card { padding: 14px 14px 10px; }
  }
</style>
</head>

const ROUND_SIZE = 30;

let currentRound = [];
let answers = {}; // index -> selected option index
let checked = false;

function pickRandomRound() {
  const pool = [...ALL_QUESTIONS];
  for (let i = pool.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [pool[i], pool[j]] = [pool[j], pool[i]];
  }
  return pool.slice(0, ROUND_SIZE);
}

function renderRound() {
  answers = {};
  checked = false;
  document.getElementById('results').style.display = 'none';
  const quizEl = document.getElementById('quiz');
  quizEl.innerHTML = '';

  currentRound.forEach((q, idx) => {
    const card = document.createElement('div');
    card.className = 'card';
    card.dataset.idx = idx;

    const num = document.createElement('div');
    num.className = 'qnum';
    num.textContent = 'Pregunta ' + (idx + 1) + ' / ' + currentRound.length;
    card.appendChild(num);

    const qtext = document.createElement('p');
    qtext.className = 'qtext';
    qtext.textContent = q.q;
    card.appendChild(qtext);

    const optsWrap = document.createElement('div');
    optsWrap.className = 'options';

    q.options.forEach((optText, optIdx) => {
      const label = document.createElement('label');
      label.className = 'option';
      label.dataset.optIdx = optIdx;

      const input = document.createElement('input');
      input.type = 'radio';
      input.name = 'q' + idx;
      input.value = optIdx;
      input.addEventListener('change', () => {
        answers[idx] = optIdx;
        optsWrap.querySelectorAll('.option').forEach(o => o.classList.remove('selected'));
        label.classList.add('selected');
        updateProgress();
      });

      const span = document.createElement('span');
      span.textContent = optText;

      label.appendChild(input);
      label.appendChild(span);
      optsWrap.appendChild(label);
    });

    card.appendChild(optsWrap);
    quizEl.appendChild(card);
  });

  updateProgress();
}

function updateProgress() {
  const answeredCount = Object.keys(answers).length;
  document.getElementById('progressText').textContent = answeredCount + ' / ' + currentRound.length + ' respondidas';
  const pct = (answeredCount / currentRound.length) * 100;
  document.getElementById('progressFill').style.width = pct + '%';
}

function checkAnswers() {
  if (checked) return;
  checked = true;
  let score = 0;

  currentRound.forEach((q, idx) => {
    const card = document.querySelector('.card[data-idx="' + idx + '"]');
    if (!card) return;
    const options = card.querySelectorAll('.option');
    const selected = answers[idx];
    if (selected === q.correct) score++;

    options.forEach((optEl) => {
      const optIdx = parseInt(optEl.dataset.optIdx, 10);
      optEl.classList.add('disabled');
      optEl.querySelector('input').disabled = true;
      if (optIdx === q.correct) {
        optEl.classList.add('correct');
      } else if (optIdx === selected && selected !== q.correct) {
        optEl.classList.add('incorrect');
      }
    });
  });

  const resultsEl = document.getElementById('results');
  resultsEl.style.display = 'block';
  document.getElementById('scoreBig').textContent = score + '/' + currentRound.length;
  const pct = Math.round((score / currentRound.length) * 100);
  let msg;
  if (pct >= 90) msg = '¡Excelente! Nivel muy sólido.';
  else if (pct >= 70) msg = '¡Muy bien! Vas por buen camino.';
  else if (pct >= 50) msg = 'Bien, pero sigue repasando.';
  else msg = 'Sigue practicando, ¡tú puedes!';
  document.getElementById('scoreDetail').textContent = pct + '% correctas — ' + msg;
  resultsEl.scrollIntoView({ behavior: 'smooth', block: 'center' });
}

function startNewRound() {
  currentRound = pickRandomRound();
  renderRound();
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

document.getElementById('shuffleBtn').addEventListener('click', startNewRound);
document.getElementById('retryBtn').addEventListener('click', startNewRound);
document.getElementById('checkBtn').addEventListener('click', checkAnswers);
document.getElementById('resetBtn').addEventListener('click', renderRound);

startNewRound();
