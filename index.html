<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Aprende con el vago de Iván</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: Arial, sans-serif;
            background: #111827;
            color: white;
        }

        .contenedor {
            text-align: center;
            width: 90%;
            max-width: 900px;
        }

        h1 {
            margin-bottom: 40px;
            font-size: 32px;
        }

        .nivel {
            display: flex;
            justify-content: center;
            gap: 20px;
            flex-wrap: wrap;
        }

        button {
            padding: 20px 35px;
            min-width: 220px;
            font-size: 18px;
            font-weight: bold;
            border: none;
            border-radius: 12px;
            cursor: pointer;
            background: #2563eb;
            color: white;
            transition: all 0.2s ease;
        }

        button:hover {
            background: #1d4ed8;
            transform: scale(1.05);
        }

        button:active {
            transform: scale(0.98);
        }

        @media (max-width: 700px) {
            h1 {
                font-size: 26px;
            }

            .nivel {
                flex-direction: column;
                align-items: center;
            }

            button {
                width: 100%;
                max-width: 300px;
            }
        }
    </style>
</head>

<body>

    <div class="contenedor">

        <h1>¿Qué nivel hacemos hoy?</h1>

        <div class="nivel">

            <button onclick="abrirHTML('https://ivangdoch-pixel.github.io/ivangdo.github.io/prueba_botones.html')">
                A1 
            </button>

            <button onclick="abrirHTML('https://ivangdoch-pixel.github.io/ivangdo.github.io/quiz-aleman-a2.html')">
                A2 (1000 preguntas)
            </button>

            <button onclick="abrirHTML('https://ivangdoch-pixel.github.io/ivangdo.github.io/quiz-aleman-b1.html')">
                B1 (1000 preguntas)
            </button>

        </div>

    </div>

    <script>
        function abrirHTML(archivo) {
            window.location.href = archivo;
        }
    </script>

</body>
</html>
