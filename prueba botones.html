<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aprendizaje</title>

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background-color: #f2f2f2;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .contenedor {
            display: flex;
            flex-direction: column;
            gap: 20px;
            width: 300px;
        }

        .boton {
            display: block;
            padding: 18px;
            text-align: center;
            text-decoration: none;
            color: white;
            background-color: #333;
            border-radius: 10px;
            font-size: 20px;
            font-weight: bold;
        }

        .boton:hover {
            background-color: #555;
        }
    </style>
</head>

<body>

    <div class="contenedor">

        <!-- Cambia las URLs de href por las que quieras -->
        <a class="boton" href="https://ejemplo.com/verbos">
            Verbos
        </a>

        <a class="boton" href="https://ejemplo.com/conjugaciones">
            Conjugaciones
        </a>

        <a class="boton" href="https://ejemplo.com/preposiciones">
            Preposiciones
        </a>

        <a class="boton" href="https://ejemplo.com/estructuras">
            Formación de estructuras de frases
        </a>

    </div>

</body>
</html>
