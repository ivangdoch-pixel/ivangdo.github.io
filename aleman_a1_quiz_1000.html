<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Deutsch A1 — Banco de 1000 preguntas</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#15151a;
    --ink-2:#1d1d24;
    --card:#201f27;
    --line:#33323d;
    --paper:#f2ede3;
    --paper-dim:#c9c4b8;
    --gold:#e0a94c;
    --gold-dim:#8a7141;
    --red:#e3595c;
    --green:#6fae7f;
    --radius:14px;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:
      radial-gradient(circle at 15% -10%, #2a2733 0%, transparent 45%),
      radial-gradient(circle at 110% 10%, #24222d 0%, transparent 40%),
      var(--ink);
    color:var(--paper);
    font-family:'Space Grotesk', sans-serif;
    min-height:100vh;
    display:flex;
    flex-direction:column;
    align-items:center;
    padding:32px 16px 64px;
  }
  .wrap{width:100%;max-width:640px;}

  /* Header */
  header{
    display:flex;
    justify-content:space-between;
    align-items:flex-end;
    gap:16px;
    margin-bottom:28px;
    flex-wrap:wrap;
  }
  .brand-eyebrow{
    font-size:12px;
    letter-spacing:.14em;
    text-transform:uppercase;
    color:var(--gold);
    font-weight:600;
    margin:0 0 6px;
  }
  h1{
    font-family:'Fraunces', serif;
    font-weight:600;
    font-size:clamp(28px,6vw,38px);
    line-height:1.05;
    margin:0;
    letter-spacing:-0.01em;
  }
  .pool-count{
    font-size:13px;
    color:var(--paper-dim);
    margin-top:8px;
  }
  .pool-count strong{color:var(--gold);font-weight:600;}

  button{font-family:inherit;cursor:pointer;}

  .shuffle-btn{
    display:flex;
    align-items:center;
    gap:8px;
    background:transparent;
    border:1px solid var(--line);
    color:var(--paper);
    padding:10px 16px;
    border-radius:999px;
    font-size:13px;
    font-weight:500;
    transition:border-color .18s ease, transform .18s ease, background .18s ease;
    white-space:nowrap;
  }
  .shuffle-btn:hover{border-color:var(--gold);background:rgba(224,169,76,.08);}
  .shuffle-btn:active{transform:scale(.97);}
  .shuffle-btn svg{width:15px;height:15px;transition:transform .5s cubic-bezier(.2,.9,.3,1.2);}
  .shuffle-btn.spin svg{transform:rotate(360deg);}

  /* Progress */
  .progress-row{
    display:flex;
    align-items:center;
    justify-content:space-between;
    margin-bottom:10px;
    font-size:12px;
    color:var(--paper-dim);
    letter-spacing:.03em;
  }
  .progress-track{
    height:4px;
    width:100%;
    background:var(--line);
    border-radius:4px;
    overflow:hidden;
    margin-bottom:26px;
  }
  .progress-fill{
    height:100%;
    background:linear-gradient(90deg, var(--gold-dim), var(--gold));
    width:0%;
    transition:width .35s cubic-bezier(.2,.8,.3,1);
  }

  /* Card */
  .card{
    background:var(--card);
    border:1px solid var(--line);
    border-radius:var(--radius);
    padding:30px 26px;
    box-shadow:0 20px 50px -25px rgba(0,0,0,.6);
    animation:rise .35s cubic-bezier(.2,.8,.3,1);
  }
  @keyframes rise{
    from{opacity:0;transform:translateY(10px);}
    to{opacity:1;transform:translateY(0);}
  }
  .q-index{
    font-size:12px;
    color:var(--gold);
    font-weight:600;
    letter-spacing:.08em;
    text-transform:uppercase;
    margin-bottom:10px;
  }
  .q-prompt{
    font-family:'Fraunces', serif;
    font-size:clamp(19px,4.4vw,23px);
    font-weight:500;
    line-height:1.35;
    margin:0 0 22px;
  }
  .options{
    display:flex;
    flex-direction:column;
    gap:10px;
  }
  .opt{
    text-align:left;
    background:var(--ink-2);
    border:1px solid var(--line);
    color:var(--paper);
    padding:14px 16px;
    border-radius:10px;
    font-size:15px;
    line-height:1.4;
    display:flex;
    gap:12px;
    align-items:flex-start;
    transition:border-color .15s ease, background .15s ease, transform .1s ease;
  }
  .opt:hover:not(:disabled){border-color:var(--gold-dim);background:#252430;}
  .opt:active:not(:disabled){transform:scale(.99);}
  .opt .tag{
    flex:0 0 auto;
    width:22px;height:22px;
    border-radius:6px;
    background:var(--line);
    display:flex;align-items:center;justify-content:center;
    font-size:11px;font-weight:600;color:var(--paper-dim);
    text-transform:uppercase;
    margin-top:1px;
  }
  .opt:disabled{cursor:default;}
  .opt.correct{border-color:var(--green);background:rgba(111,174,127,.12);}
  .opt.correct .tag{background:var(--green);color:#0f1c12;}
  .opt.incorrect{border-color:var(--red);background:rgba(227,89,92,.12);}
  .opt.incorrect .tag{background:var(--red);color:#280d0e;}
  .opt.reveal{opacity:.55;}

  .explain{
    margin-top:18px;
    padding-top:16px;
    border-top:1px dashed var(--line);
    font-size:14px;
    color:var(--paper-dim);
    line-height:1.5;
    display:none;
  }
  .explain.show{display:block;}
  .explain strong{color:var(--paper);}

  .next-row{
    margin-top:22px;
    display:flex;
    justify-content:flex-end;
  }
  .next-btn{
    background:var(--gold);
    color:#241a08;
    border:none;
    padding:12px 22px;
    border-radius:999px;
    font-weight:600;
    font-size:14px;
    display:none;
    align-items:center;
    gap:8px;
    transition:transform .15s ease, background .15s ease;
  }
  .next-btn.show{display:flex;}
  .next-btn:hover{background:#eebb64;transform:translateY(-1px);}

  /* Results */
  .results{
    text-align:center;
    padding:12px 4px 4px;
  }
  .score-ring-wrap{
    display:flex;justify-content:center;margin-bottom:22px;
  }
  .score-num{
    font-family:'Fraunces', serif;
    font-size:64px;
    font-weight:600;
    line-height:1;
  }
  .score-den{
    font-size:16px;
    color:var(--paper-dim);
    margin-top:2px;
  }
  .results h2{
    font-family:'Fraunces', serif;
    font-weight:600;
    font-size:24px;
    margin:0 0 8px;
  }
  .results p.msg{
    color:var(--paper-dim);
    font-size:14px;
    margin:0 0 28px;
  }
  .results-actions{
    display:flex;
    gap:12px;
    justify-content:center;
    flex-wrap:wrap;
  }
  .btn-primary, .btn-secondary{
    padding:13px 22px;
    border-radius:999px;
    font-weight:600;
    font-size:14px;
    border:none;
    display:inline-flex;align-items:center;gap:8px;
    transition:transform .15s ease, background .15s ease, border-color .15s ease;
  }
  .btn-primary{background:var(--gold);color:#241a08;}
  .btn-primary:hover{background:#eebb64;transform:translateY(-1px);}
  .btn-secondary{background:transparent;color:var(--paper);border:1px solid var(--line);}
  .btn-secondary:hover{border-color:var(--paper-dim);}

  .missed{
    margin-top:32px;
    text-align:left;
    border-top:1px solid var(--line);
    padding-top:22px;
  }
  .missed h3{
    font-size:12px;
    text-transform:uppercase;
    letter-spacing:.08em;
    color:var(--paper-dim);
    margin:0 0 14px;
  }
  .missed-item{
    font-size:13.5px;
    padding:10px 0;
    border-bottom:1px solid var(--line);
    line-height:1.5;
  }
  .missed-item:last-child{border-bottom:none;}
  .missed-item .mi-q{color:var(--paper);font-weight:500;margin-bottom:4px;}
  .missed-item .mi-a{color:var(--paper-dim);}
  .missed-item .mi-a b{color:var(--green);font-weight:600;}

  footer{
    margin-top:40px;
    text-align:center;
    font-size:12px;
    color:var(--paper-dim);
    opacity:.6;
  }

  @media (max-width:480px){
    .card{padding:24px 18px;}
    header{align-items:flex-start;}
  }

  @media (prefers-reduced-motion: reduce){
    *{animation:none !important;transition:none !important;}
  }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div>
      <p class="brand-eyebrow">Deutsch · Niveau A1</p>
      <h1>Banco de 1000<br>preguntas</h1>
      <p class="pool-count">Cada ronda toma <strong>30</strong> preguntas al azar de un total de <strong id="poolTotal">1000</strong>.</p>
    </div>
    <button class="shuffle-btn" id="shuffleBtn" title="Generar 30 preguntas nuevas">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="16 3 21 3 21 8"></polyline><line x1="4" y1="20" x2="21" y2="3"></line><polyline points="21 16 21 21 16 21"></polyline><line x1="15" y1="15" x2="21" y2="21"></line><line x1="4" y1="4" x2="9" y2="9"></line></svg>
      Nuevas 30
    </button>
  </header>

  <div class="progress-row">
    <span id="progressLabel">Pregunta 1 / 30</span>
    <span id="scoreLabel">Aciertos: 0</span>
  </div>
  <div class="progress-track"><div class="progress-fill" id="progressFill"></div></div>

  <div id="quizArea"></div>

  <footer>Pulsa «Nuevas 30» cuando quieras para barajar otras 30 preguntas del banco completo.</footer>
</div>

":"a","text":"wer"},{"id":"b","text":"wie viele"},{"id":"c","text":"wohin"},{"id":"d","text":"wo"}],"correct_option_id":"a","explanation":"'quién' se dice 'wer' en alemán."},{"id":"q982","prompt":"¿Qué significa 'Ich bin krank.'?","options":[{"id":"a","text":"Estoy enfermo."},{"id":"b","text":"El restaurante está cerrado."},{"id":"c","text":"Nos vemos mañana."},{"id":"d","text":"¿Qué hora es?"}],"correct_option_id":"a","explanation":"'Ich bin krank.' significa 'Estoy enfermo.'."},{"id":"q983","prompt":"Conjuga 'müssen' con 'du':","options":[{"id":"a","text":"muss"},{"id":"b","text":"müsst"},{"id":"c","text":"musst"},{"id":"d","text":"müssen"}],"correct_option_id":"c","explanation":"La forma correcta de 'müssen' con 'du' es 'musst'."},{"id":"q984","prompt":"¿Cómo se dice 'Adiós' en alemán?","options":[{"id":"a","text":"Tschüss"},{"id":"b","text":"Es tut mir leid"},{"id":"c","text":"Entschuldigung"},{"id":"d","text":"Guten Abend"}],"correct_option_id":"a","explanation":"'Adiós' se dice 'Tschüss' en alemán."},{"id":"q985","prompt":"¿Qué significa 'die Kartoffel'?","options":[{"id":"a","text":"el pescado"},{"id":"b","text":"la sal"},{"id":"c","text":"la patata"},{"id":"d","text":"el agua"}],"correct_option_id":"c","explanation":"'die Kartoffel' significa 'la patata'."},{"id":"q986","prompt":"¿Qué significa 'der Kaffee'?","options":[{"id":"a","text":"la carne"},{"id":"b","text":"el huevo"},{"id":"c","text":"el café"},{"id":"d","text":"la fruta"}],"correct_option_id":"c","explanation":"'der Kaffee' significa 'el café'."},{"id":"q987","prompt":"¿Qué número es 'neun' en alemán?","options":[{"id":"a","text":"19"},{"id":"b","text":"8"},{"id":"c","text":"9"},{"id":"d","text":"21"}],"correct_option_id":"c","explanation":"'neun' es el número 9."},{"id":"q988","prompt":"¿Cómo se dice 'febrero' en alemán?","options":[{"id":"a","text":"Februar"},{"id":"b","text":"Juli"},{"id":"c","text":"Mai"},{"id":"d","text":"April"}],"correct_option_id":"a","explanation":"'febrero' se dice 'Febr "},{"id":"d","text":"schwierig"}],"correct_option_id":"d","explanation":"El opuesto de 'einfach' es 'schwierig'."},{"id":"q997","prompt":"¿Cómo se dice 'preguntar' en alemán?","options":[{"id":"a","text":"zeigen"},{"id":"b","text":"lernen"},{"id":"c","text":"schreiben"},{"id":"d","text":"fragen"}],"correct_option_id":"d","explanation":"'preguntar' se dice 'fragen' en alemán."},{"id":"q998","prompt":"¿Cómo se dice 'el tiempo (clima)' en alemán?","options":[{"id":"a","text":"das Wetter"},{"id":"b","text":"kalt"},{"id":"c","text":"warm"},{"id":"d","text":"die Sonne"}],"correct_option_id":"a","explanation":"'el tiempo (clima)' se dice 'das Wetter' en alemán."},{"id":"q999","prompt":"¿Cuál es el artículo correcto de 'Tante' (la tía)?","options":[{"id":"a","text":"das"},{"id":"b","text":"der"},{"id":"c","text":"die"},{"id":"d","text":"dem"}],"correct_option_id":"c","explanation":"'Tante' es femenino: 'die Tante'."},{"id":"q1000","prompt":"¿Cuál es el plural de 'das Jahr'?","options":[{"id":"a","text":"die Zimmer"},{"id":"b","text":"die Bücher"},{"id":"c","text":"die Freunde"},{"id":"d","text":"die Jahre"}],"correct_option_id":"d","explanation":"El plural de 'das Jahr' es 'die Jahre'."}]</script>
<script>
(function(){
  const ALL_QUESTIONS = JSON.parse(document.getElementById('questionData').textContent);
  document.getElementById('poolTotal').textContent = ALL_QUESTIONS.length;

  const ROUND_SIZE = 30;
  let round = [];
  let idx = 0;
  let score = 0;
  let missed = [];
  let answered = false;

  const quizArea = document.getElementById('quizArea');
  const progressFill = document.getElementById('progressFill');
  const progressLabel = document.getElementById('progressLabel');
  const scoreLabel = document.getElementById('scoreLabel');
  const shuffleBtn = document.getElementById('shuffleBtn');

  function pickRound(){
    const pool = ALL_QUESTIONS.slice();
    for(let i = pool.length - 1; i > 0; i--){
      const j = Math.floor(Math.random() * (i + 1));
      [pool[i], pool[j]] = [pool[j], pool[i]];
    }
    return pool.slice(0, ROUND_SIZE);
  }

  function startRound(){
    round = pickRound();
    idx = 0;
    score = 0;
    missed = [];
    answered = false;
    renderQuestion();
  }

  function updateProgress(){
    const pct = (idx / round.length) * 100;
    progressFill.style.width = pct + '%';
    progressLabel.textContent = `Pregunta ${Math.min(idx+1, round.length)} / ${round.length}`;
    scoreLabel.textContent = `Aciertos: ${score}`;
  }

  function renderQuestion(){
    updateProgress();
    answered = false;
    const q = round[idx];
    const optsHtml = q.options.map(o => `
      <button class="opt" data-id="${o.id}">
        <span class="tag">${o.id}</span>
        <span>${escapeHtml(o.text)}</span>
      </button>
    `).join('');

    quizArea.innerHTML = `
      <div class="card">
        <p class="q-index">Pregunta ${idx+1} de ${round.length}</p>
        <p class="q-prompt">${escapeHtml(q.prompt)}</p>
        <div class="options">${optsHtml}</div>
        <div class="explain" id="explainBox"><strong>Explicación:</strong> <span id="explainText"></span></div>
        <div class="next-row">
          <button class="next-btn" id="nextBtn">
            ${idx === round.length - 1 ? 'Ver resultados' : 'Siguiente'}
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="5" y1="12" x2="19" y2="12"></line><polyline points="12 5 19 12 12 19"></polyline></svg>
          </button>
        </div>
      </div>
    `;

    const optButtons = quizArea.querySelectorAll('.opt');
    optButtons.forEach(btn => {
      btn.addEventListener('click', () => onAnswer(btn, q));
    });
  }

  function onAnswer(btn, q){
    if(answered) return;
    answered = true;
    const chosenId = btn.dataset.id;
    const isCorrect = chosenId === q.correct_option_id;
    if(isCorrect){
      score++;
    } else {
      missed.push({prompt:q.prompt, correct:q.options.find(o=>o.id===q.correct_option_id).text, chosen:btn.textContent.trim()});
    }

    quizArea.querySelectorAll('.opt').forEach(b => {
      b.disabled = true;
      if(b.dataset.id === q.correct_option_id){
        b.classList.add('correct');
      } else if(b === btn){
        b.classList.add('incorrect');
      } else {
        b.classList.add('reveal');
      }
    });

    const explainBox = document.getElementById('explainBox');
    document.getElementById('explainText').textContent = q.explanation;
    explainBox.classList.add('show');

    const nextBtn = document.getElementById('nextBtn');
    nextBtn.classList.add('show');
    nextBtn.addEventListener('click', () => {
      idx++;
      if(idx >= round.length){
        renderResults();
      } else {
        renderQuestion();
      }
    });

    updateProgress();
  }

  function renderResults(){
    progressFill.style.width = '100%';
    progressLabel.textContent = `Ronda completada · ${round.length} preguntas`;
    scoreLabel.textContent = `Aciertos: ${score}`;

    const pct = Math.round((score / round.length) * 100);
    let msg = '';
    if(pct === 100) msg = 'Perfecto, mi gitanico. Dominado del todo.';
    else if(pct >= 80) msg = 'Muy sólido. Un empujón más y lo bordas.';
    else if(pct >= 60) msg = 'Buen nivel, con algunas cosas por repasar.';
    else if(pct >= 40) msg = 'Vas cogiendo el hilo. Sigue practicando.';
    else msg = 'Toca repasar con calma — inténtalo de nuevo.';

    const missedHtml = missed.length ? `
      <div class="missed">
        <h3>Para repasar (${missed.length})</h3>
        ${missed.map(m => `
          <div class="missed-item">
            <div class="mi-q">${escapeHtml(m.prompt)}</div>
            <div class="mi-a">Correcta: <b>${escapeHtml(m.correct)}</b> · Tu respuesta: ${escapeHtml(m.chosen)}</div>
          </div>
        `).join('')}
      </div>
    ` : '';

    quizArea.innerHTML = `
      <div class="card results">
        <div class="score-ring-wrap">
          <div>
            <div class="score-num">${score}<span style="font-size:28px;color:var(--paper-dim);">/${round.length}</span></div>
            <div class="score-den">${pct}% de aciertos</div>
          </div>
        </div>
        <h2>Ronda terminada</h2>
        <p class="msg">${msg}</p>
        <div class="results-actions">
          <button class="btn-primary" id="newRoundBtn">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="16 3 21 3 21 8"></polyline><line x1="4" y1="20" x2="21" y2="3"></line><polyline points="21 16 21 21 16 21"></polyline><line x1="15" y1="15" x2="21" y2="21"></line><line x1="4" y1="4" x2="9" y2="9"></line></svg>
            Nuevas 30 preguntas
          </button>
          <button class="btn-secondary" id="retryBtn">Repetir estas mismas</button>
        </div>
        ${missedHtml}
      </div>
    `;

    document.getElementById('newRoundBtn').addEventListener('click', startRound);
    document.getElementById('retryBtn').addEventListener('click', () => {
      idx = 0; score = 0; missed = []; answered = false; renderQuestion();
    });
  }

  function escapeHtml(str){
    const div = document.createElement('div');
    div.textContent = str;
    return div.innerHTML;
  }

  shuffleBtn.addEventListener('click', () => {
    shuffleBtn.classList.add('spin');
    setTimeout(() => shuffleBtn.classList.remove('spin'), 500);
    startRound();
  });

  startRound();
})();
</script>
